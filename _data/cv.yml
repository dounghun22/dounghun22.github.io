papers:
  - title: "A New NB-LDPC Code Construction Method with Arbitrary Generalized Girth"
    year: 2026
    is_first_author: false
    authors: Jaeil Lim, Jaewon Chung, Donghun Jeong, Daegeun Jee, and Euicheol Lim
    venue: "IEEE Transactions on Communications · 2026 · Co-Author"
    description: Proposes a permutation-graph-based analysis and construction method for NB-LDPC codes with arbitrary generalized girth, reducing construction complexity while improving error-correction performance.
    keywords: NB-LDPC, Error-Correcting Code, Generalized Girth
    doi: 10.1109/TCOMM.2026.3686671
    url: https://doi.org/10.1109/TCOMM.2026.3686671
