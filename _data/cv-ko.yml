name: Donghun Jeong
role: 컴퓨터 아키텍처 및 디지털 로직 설계 전문가
location: 대한민국 성남시
email: dounghun22@gmail.com
summary: >-
  안녕하세요. 컴퓨터 아키텍처와 디지털 로직 설계 전문가 정동훈입니다.
  컴퓨터 아키텍처 석사 과정에서 GP-GPU 메모리 압축과 주소 변환 기법을 포함한 메모리
  서브시스템을 연구했습니다. 현재 SK hynix에서 메모리 솔루션 디바이스 컨트롤러용 SoC를
  설계하며, 시스템 성능과 효율을 최적화하는 데 전문성을 활용하고 있습니다. 이 분야의
  혁신적인 아이디어를 바탕으로 다수의 특허를 출원했으며, 복잡한 문제를 분석해 최첨단
  해결책을 개발하고 반도체 산업의 기술 발전에 기여하는 일을 지향합니다.

