    doi: 10.1109/TC.2024.3521545
    url: https://doi.org/10.1109/TC.2024.3521545
  - title: "Demand MemCpy: Overlapping of Computation and Data Transfer for Heterogeneous Computing"
    year: 2022
    is_first_author: true
    authors: Donghun Jeong, Jihun Park, and Jungrae Kim
    venue: "IEEE Access 10, 79925–79938 · 2022 · First Author"
    description: Demand MemCpy overlaps computation and data transfer at page granularity to reduce unused transfers. Evaluation showed a 25.4% average reduction in end-to-end execution time for GP-GPU applications.
    keywords: GP-GPU, Address Translation, PCIe
    doi: 10.1109/ACCESS.2022.3195271
    url: https://doi.org/10.1109/ACCESS.2022.3195271
  - title: "UVMMU: Hardware-Offloaded Page Migration for Heterogeneous Computing"
