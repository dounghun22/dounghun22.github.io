projects:
  - title: Development of CXL 3.x Type 3 Device Controller
    period: 01/2024 – 08/2025 · SK hynix
    description: Responsible for the architecture design and RTL implementation of the solution part, including custom and RAS features, in CXL controllers.
    contributions:
      - Designed optimized architecture for customer-specific features.
      - Designed AXI slave IP RTL.
  - title: Proposed a dynamic DRAM address allocation technique to improve DRAM efficiency.
    period: 03/2022 – 02/2023 · SKKU
    description: Conducted a project supported by Samsung Electronics System LSI to enhance DRAM bandwidth efficiency in mobile application processors. Proposed a technique for dynamically changing DRAM rows to optimize performance.
    contributions:
      - Estimated DRAM power using the Micron DRAM power model and LPDDR5 datasheet.
  - title: Optimizing Network Efficiency for Distributed AI Systems
    period: 03/2020 – 12/2022 · SKKU
    description: Participated in an NRF-funded research project to optimize network efficiency in distributed systems, specifically by reducing PCIe overhead in heterogeneous systems.
    contributions:
      - Analyzed PCIe overhead in heterogeneous systems using GPGPU-Sim.
  - title: Developing Memory Compression Algorithm for APs
    period: 03/2020 – 02/2022 · SKKU
    description: Proposed a memory compression algorithm to optimize performance and efficiency in mobile application processors, as part of an industry-academic collaboration with Samsung Electronics' System LSI Business Division.
    contributions:
      - Analyzed and modified GP-GPU simulation code to extract and process memory data.
      - Analyzed simulator-extracted raw data with Python, NumPy, and Pandas.

