summary: >-
  컴퓨터 아키텍처와 디지털 로직 설계를 기반으로 메모리·스토리지 솔루션 SoC를 개발하는
  엔지니어입니다. 성균관대학교 석사 과정에서 GP-GPU 메모리 압축과 주소 변환을 포함한
  메모리 서브시스템을 연구했으며, 현재 SK hynix Solution 사업부에서 SoC IP의 RTL 설계를
  수행하고 있습니다. 복잡한 시스템 요구사항을 분석해 성능·전력·신뢰성의 균형을 갖춘
  구조로 구체화하는 데 강점이 있으며, 메모리 시스템과 데이터 저장 기술 분야의 특허 활동을
  통해 기술적 가치를 만들어가고 있습니다.

