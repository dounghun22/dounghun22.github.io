    year: 2025
    is_first_author: false
    authors: Jaeil Lim, Jaewon Chung, Donghun Jeong, Daegeun Jee, and Euicheol Lim
    venue: "IEEE Transactions on Circuits and Systems II: Express Briefs 72 (9), 1293–1297 · 2025 · Co-Author"
    description: Presents a two-tiered ECC configuration for HBM that corrects sub-wordline-driver cluster faults while reducing encoder and decoder hardware overhead and latency.
    keywords: HBM, Error-Correcting Code, DRAM
    doi: 10.1109/TCSII.2025.3593226
    url: https://doi.org/10.1109/TCSII.2025.3593226
  - title: "A New ECC Configuration Method for DRAM System Considering Metadata"
    year: 2025
    is_first_author: false
