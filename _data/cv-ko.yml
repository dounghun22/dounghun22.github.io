  - title: DRAM 효율 향상을 위한 동적 DRAM 주소 할당 기법 제안
    period: 03/2022 – 02/2023 · SKKU
    description: 모바일 애플리케이션 프로세서의 DRAM 대역폭 효율 향상을 위해 삼성전자 System LSI의 지원으로 수행한 프로젝트입니다. 성능 최적화를 위해 DRAM row를 동적으로 변경하는 기법을 제안했습니다.
    contributions:
      - Micron DRAM power model과 LPDDR5 데이터시트를 이용한 DRAM 전력 추정
  - title: 분산 AI 시스템의 네트워크 효율 최적화
    period: 03/2020 – 12/2022 · SKKU
    description: 이기종 시스템에서 PCIe 오버헤드를 줄여 분산 시스템의 네트워크 효율을 최적화하는 NRF 지원 연구 프로젝트에 참여했습니다.
    contributions:
      - GPGPU-Sim을 이용한 이기종 시스템의 PCIe 오버헤드 분석
  - title: AP용 메모리 압축 알고리즘 개발
    period: 03/2020 – 02/2022 · SKKU
    description: 삼성전자 System LSI 사업부와의 산학 협력으로 모바일 애플리케이션 프로세서의 성능과 효율을 최적화하기 위한 메모리 압축 알고리즘을 제안했습니다.
    contributions:
      - 메모리 데이터 추출·처리를 위한 GP-GPU 시뮬레이션 코드 분석 및 수정
