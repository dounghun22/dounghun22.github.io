summary: >-
  I am an engineer developing memory and storage solution SoCs, with a foundation in computer
  architecture and digital logic design. During my master’s studies at Sungkyunkwan University, I
  researched memory subsystems, including GP-GPU memory compression and address translation. I
  currently design RTL for SoC IPs in SK hynix’s Solution Division. I excel at translating complex
  system requirements into designs that balance performance, power, and reliability, and I continue
  to create technical value through patent work in memory systems and data storage technologies.

